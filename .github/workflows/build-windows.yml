name: Build Windows EXE
on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'index.html'
      - 'assets/**'
      - 'desktop/**'
      - 'tests/**'
      - 'build/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/build-windows.yml'
permissions:
  contents: read
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    name: Windows x64 - portable and installer
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned build tools
        shell: pwsh
        run: |
          if (Test-Path package-lock.json) { npm ci --no-audit --no-fund } else { npm install --no-audit --no-fund }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Calculation, project, and security tests
        run: npm test
      - name: Check local-only assets
        run: npm run check:offline
      - name: Build EXE files
        run: npm run dist:win
      - name: Verify packaged desktop application
        shell: pwsh
        run: |
          $env:PF_SMOKE_OUTPUT = Join-Path $env:GITHUB_WORKSPACE 'dist/desktop-smoke.json'
          $app = Join-Path $env:GITHUB_WORKSPACE 'dist/win-unpacked/ProcureFlow.exe'
          $proc = Start-Process -FilePath $app -ArgumentList '--smoke-test' -PassThru -Wait
          if ($proc.ExitCode -ne 0) { throw "Desktop smoke test failed with exit code $($proc.ExitCode)" }
          if (!(Test-Path $env:PF_SMOKE_OUTPUT)) { throw 'Smoke report not found' }
          $report = Get-Content $env:PF_SMOKE_OUTPUT -Raw | ConvertFrom-Json
          if (!$report.ok) { throw 'Desktop smoke tests failed' }
          Get-Content $env:PF_SMOKE_OUTPUT
      - name: Write SHA256 checksums
        shell: pwsh
        run: |
          Get-ChildItem dist/*.exe | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)"
          } | Set-Content dist/SHA256SUMS.txt -Encoding utf8
          Copy-Item package-lock.json dist/package-lock.resolved.json
      - name: Upload Windows applications
        uses: actions/upload-artifact@v4
        with:
          name: ProcureFlow-Windows-x64
          path: |
            dist/*.exe
            dist/SHA256SUMS.txt
            dist/desktop-smoke.json
            dist/package-lock.resolved.json
          if-no-files-found: error
          retention-days: 14
      - name: Keep build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ProcureFlow-Build-Diagnostics
          path: |
            dist/desktop-smoke.json
            dist/builder-debug.yml
          if-no-files-found: ignore
